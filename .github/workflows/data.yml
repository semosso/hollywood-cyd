name: Dados (TMDB + OMDb + Wikidata)

on:
  workflow_dispatch:
    inputs:
      resolve:
        description: "Também rodar `resolve` para os filmes sem tmdb_id"
        type: boolean
        default: true
      discover:
        description: "Acrescentar à lista os N filmes mais votados de cada ano (0 = não)"
        type: string
        default: "0"
      discover_bad:
        description: "Acrescentar os N filmes MAL avaliados mais conhecidos de cada ano (0 = não)"
        type: string
        default: "0"
  schedule:
    - cron: "17 6 1 * *"   # dia 1 de cada mês, 06:17 UTC: atualiza bilheteria e notas

permissions:
  contents: write
  actions: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  build-data:
    runs-on: ubuntu-latest
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      HCYD_CACHE_DIR: ${{ github.workspace }}/pipeline/cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # Runs na fila ficam presos ao commit do disparo; um run anterior pode já ter
      # commitado dados novos. Sincroniza com a ponta de main antes de gerar.
      - name: Sincronizar com main
        run: git fetch origin main && git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache das respostas das APIs
        uses: actions/cache@v4
        with:
          path: pipeline/cache
          key: hcyd-cache-${{ hashFiles('pipeline/curation/films.csv') }}
          # Sem isto, cada mudança na lista curada zera o cache e o OMDb (1000 pedidos/dia) estoura.
          restore-keys: |
            hcyd-cache-
          restore-keys: hcyd-cache-
      - name: Instalar dependências
        run: pip install -r pipeline/requirements.txt
      - name: Checar chaves
        run: |
          if [ -z "$TMDB_API_KEY" ] && [ -z "$TMDB_READ_TOKEN" ]; then echo "::error::Falta o segredo TMDB_API_KEY (ou TMDB_READ_TOKEN)"; exit 1; fi
          if [ -z "$OMDB_API_KEY" ]; then echo "::warning::Sem OMDB_API_KEY: crítica (RT/Metacritic) ficará vazia"; fi
      - name: Status
        working-directory: pipeline
        run: python -m hcyd status
      - name: Descobrir filmes no TMDB
        if: ${{ inputs.discover != '' && inputs.discover != '0' }}
        working-directory: pipeline
        run: python -m hcyd discover ${{ inputs.discover }}
      - name: Descobrir fracassos no TMDB
        if: ${{ inputs.discover_bad != '' && inputs.discover_bad != '0' }}
        working-directory: pipeline
        run: python -m hcyd discover ${{ inputs.discover_bad }} --bad
      - name: Resolver ids faltantes
        if: ${{ inputs.resolve != false }}
        working-directory: pipeline
        run: python -m hcyd resolve
      - name: Baixar dados
        working-directory: pipeline
        run: python -m hcyd fetch
      - name: Gerar data/films.json
        working-directory: pipeline
        run: python -m hcyd build
      - name: Testes do pipeline
        working-directory: pipeline
        run: pytest -q
      - name: Copiar para o jogo (versão enxuta)
        working-directory: pipeline
        run: python -m hcyd slim
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - name: Relatório de balanceamento (simulação)
        working-directory: game
        run: npm ci && npm run sim -- 1500 ../data/balance.md > /dev/null
      - name: Commit dos dados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/films.json data/people.json data/balance.md game/src/data/films.json pipeline/curation/films.csv pipeline/curation/films.resolved.csv || true
          if git diff --cached --quiet; then echo "nada mudou"; exit 0; fi
          git commit -m "data: atualiza films.json e people.json via pipeline"
          # o main pode ter avançado durante o job: rebase antes de empurrar, até 3 tentativas
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            [ "$i" = 3 ] && exit 1
            sleep 5
          done
      - name: Redeploy do site com os dados novos
        # pushes feitos com GITHUB_TOKEN não disparam o workflow de push; o dispatch explícito dispara
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main || echo "::warning::não consegui disparar o deploy; rode-o manualmente"
